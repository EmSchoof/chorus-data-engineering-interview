version: 2

sources:
  - name: task_tracking
    description: Task tracking source tables
    database: postgres
    schema: public
    tables:
      - name: Task
        description: Task definitions with recurrence patterns
        columns:
          - name: task_id
            description: Unique task identifier
            tests:
              - unique
              - not_null
          - name: task_name
            description: Name of the task
            tests:
              - not_null
          - name: cadence
            description: Recurrence pattern (daily, weekly, monthly)
            tests:
              - not_null
          - name: start_date
            description: Date when the task starts
            tests:
              - not_null
          - name: max_occurrences
            description: Maximum number of occurrences for the task
            tests:
              - not_null

      - name: Person
        description: People assigned to tasks
        columns:
          - name: person_id
            description: Unique person identifier
            tests:
              - unique
              - not_null
          - name: person_name
            description: Person full name
            tests:
              - not_null
          - name: created_at
            description: Timestamp of when the person record was created
            tests:
              - not_null
          - name: updated_at
            description: Timestamp of the last update to the person record
            tests:
              - not_null

      - name: TaskAssignment
        description: Assignment of tasks to people
        columns:
          - name: task_assignment_id
            description: Unique identifier for each task assignment
            tests:
              - unique
              - not_null
          - name: task_id
            description: Unique task identifier
            tests:
              - not_null
          - name: person_id
            description: Unique person identifier
            tests:
              - not_null
          - name: assignment_date
            description: Timestamp of when the task was assigned to the person
            tests:
              - not_null

      - name: TaskOccurrence
        description: Generated task occurrence records for each task assignment
        columns:
          - name: task_occurrence_id
            description: Unique identifier for each scheduled task occurrence
            tests:
              - unique
              - not_null
          - name: task_assignment_id
            description: Assignment this occurrence belongs to
            tests:
              - not_null
          - name: task_id
            description: Task this occurrence is for
            tests:
              - not_null
          - name: person_id
            description: Person assigned to this occurrence
            tests:
              - not_null
          - name: occurrence_number
            description: Occurrence number for this task assignment
            tests:
              - not_null

          - name: scheduled_start_date
            description: Date this occurrence is scheduled to start
            tests:
              - not_null
          - name: scheduled_end_date
            description: Date this occurrence is scheduled to end
          - name: created_at
            description: Timestamp when this occurrence record was created
            tests:
              - not_null

      - name: TaskOccurrenceStatus
        description: Status tracking for task occurrences
        columns:
          - name: task_occurrence_id
            description: Reference to task occurrence
            tests:
              - unique
              - not_null
          - name: status
            description: Current status of the task occurrence
            tests:
              - not_null
          - name: updated_at
            description: When the status was last updated
            tests:
              - not_null
